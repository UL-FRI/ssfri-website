name: Preview PR

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - if: github.event.action != 'closed'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils pandoc

      - if: github.event.action != 'closed'
        run: npm ci

      - if: github.event.action != 'closed'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}/pr-preview/pr-${{ github.event.number }}

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
