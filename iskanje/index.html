		translations: {
			placeholder: 'Išči po novicah, straneh in dokumentih',

			search_suggestion: 'Ni rezultatov za [SEARCH_TERM]. Poskusi še: ',
			element_for: 'Iskanje',
		},
	});
	const q = new URLSearchParams(location.search).get('q');
	if (q) ui.triggerSearch(q);
